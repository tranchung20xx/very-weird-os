---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: very-weird-os
# description will be included in the image's metadata
description: This is my personal weird OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/blue-build/base-images/fedora-base
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    install:
      packages:
        - initial-setup

  - type: systemd
    system:
      enabled:
        - initial-setup.service

  # - type: dnf
  #   repos:

  #     copr:
  #       - atim/starship
  #   install:
  #     packages:
  #       - micro
  #       - starship
  #   remove:
  #     packages:
  #       # example: removing firefox (in favor of the flatpak)
  #       # "firefox" is the main package, "firefox-langpacks" is a dependency
  #       - firefox
  #       - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)

  # - type: default-flatpaks
  #   configurations:
  #     - notify: true # Send notification after install/uninstall is finished (true/false)
  #       scope: system
  #       # If no repo information is specified, Flathub will be used by default
  #       install: # system flatpaks we want all users to have and not remove
  #         - org.mozilla.firefox
  #         - org.gnome.Loupe
  #     - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully

    # 1) Install the English locale first so langpacks-en doesn't get dragged out
  - type: dnf
    install:
      packages:
        - glibc-langpack-en
        - glibc-minimal-langpack

  # 2) Remove everything else
  - type: dnf
    remove:
      packages:
        # --- locales (English only) ---
        - glibc-all-langpacks
        - gawk-all-langpacks

        # --- input methods you don't type ---
        - ibus-anthy
        - ibus-anthy-python
        - anthy-unicode
        - kasumi-common
        - kasumi-unicode
        - ibus-chewing
        - libchewing
        - ibus-hangul
        - libhangul
        - ibus-libpinyin
        - libpinyin
        - libpinyin-data

        # --- accessibility and speech ---
        - orca
        - speech-dispatcher
        - speech-dispatcher-espeak-ng
        - speech-dispatcher-libs
        - speech-dispatcher-utils
        - python3-speechd
        - espeak-ng
        - flite
        - dotconf
        - pcaudiolib
        - brltty
        - brlapi
        - python3-brlapi
        - liblouis
        - liblouis-tables
        - liblouisutdml
        - liblouisutdml-utils
        - python3-louis

        # --- printing and scanning ---
        - cups
        - cups-browsed
        - cups-client
        - cups-filters
        - cups-filters-driverless
        - cups-ipptool
        - bluez-cups
        - python3-cups
        - system-config-printer-libs
        - system-config-printer-udev
        - hplip
        - hplip-common
        - hplip-libs
        - libsane-hpaio
        - gutenprint
